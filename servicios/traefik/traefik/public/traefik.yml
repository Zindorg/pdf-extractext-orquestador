global:
  sendAnonymousUsage: false

# Sin dashboard: estaba publicado sin autenticación (api.insecure y un router a api@internal).
api:
  dashboard: false
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    network: public-net
    constraints: "Label(`traefik.edge`,`public`)"

  file:
    filename: /etc/traefik/config.yml
    watch: true


log:
  level: INFO
  format: json

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
