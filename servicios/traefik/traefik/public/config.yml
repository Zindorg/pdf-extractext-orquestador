http:
  middlewares:
    orch-ratelimit:
      rateLimit:
        average: 100
        burst: 200
    # Corta en el borde un cuerpo mayor que MAX_DOCUMENT_BYTES (10 MiB) + margen del multipart.
    orch-body-limit:
      buffering:
        maxRequestBodyBytes: 11534336
    orch-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
    orch-cb:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"

tls:
  certificates:
    - certFile: "/etc/certs/cert.pem"
      keyFile: "/etc/certs/key.pem"
