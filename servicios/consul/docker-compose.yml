services:
  consul:
    image: hashicorp/consul:2.0.4
    volumes:
      - "./data:/consul/data"
      - "./config:/consul/config"
      - /etc/localtime:/etc/localtime:ro
    command: agent -server -client=0.0.0.0 -bootstrap -ui -data-dir=/consul/data -config-dir=/consul/config -bootstrap-expect=1
    networks:
      - mired
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consul.rule=Host(`consul.universidad.localhost`)"
      - "traefik.http.routers.consul.entryPoints=https"
      - "traefik.http.routers.consul.tls=true"
      - "traefik.http.services.consul.loadbalancer.server.port=8500"

networks:
  mired:
    external: true

