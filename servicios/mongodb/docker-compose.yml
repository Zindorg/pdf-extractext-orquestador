services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [db-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 10
      start_period: 20s
    environment:
      # Solo se aplican la primera vez, con el volumen mongo-data vacío.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?definir MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?definir MONGO_ROOT_PASSWORD}
networks:
  db-net:
    external: true
volumes:
  mongo-data:
