# Orquestador: punto de entrada público. No publica puertos al host: solo `traefik-public` expone
# 80/443, y por eso el borde es el único camino (ADR-0005). Vive en `public-net` (borde) y `mired`
# (workers, Redis y Persistidor), nunca en `db-net`.
services:
  orchestrator:
    image: pdf-extractext-orquestador:v${VERSION:-0.1.0}
    build: ../pdf-extractext-orquestador
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Argentina/Mendoza}
      - HTTP_PORT=8080
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL}
      - EXTRACTOR_URL=http://extractor.internal
      - SUMMARIZER_URL=http://summarizer.internal
      - PERSISTER_URL=http://persister.internal
      - REDIS_ADDR=redis:6379
      - STREAM_NAME=${STREAM_NAME:-document-events}
    networks:
      - public-net
      - mired
    depends_on:
      redis: { condition: service_healthy }
      traefik-internal: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.edge=public
      - traefik.docker.network=public-net
      # API
      - traefik.http.routers.orch-api.rule=Host(`${PUBLIC_HOST:?definir PUBLIC_HOST}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.orch-api.priority=100
      - traefik.http.routers.orch-api.entrypoints=https
      - traefik.http.routers.orch-api.tls=true
      - traefik.http.routers.orch-api.service=orch
      - traefik.http.routers.orch-api.middlewares=orch-ratelimit@file,orch-cb@file
      # Web front (HTML)
      - traefik.http.routers.orch-web.rule=Host(`${PUBLIC_HOST:?definir PUBLIC_HOST}`)
      - traefik.http.routers.orch-web.priority=1
      - traefik.http.routers.orch-web.entrypoints=https
      - traefik.http.routers.orch-web.tls=true
      - traefik.http.routers.orch-web.service=orch
      - traefik.http.routers.orch-web.middlewares=orch-ratelimit@file
      - traefik.http.services.orch.loadbalancer.server.port=8080

networks:
  public-net:
    external: true
  mired:
    external: true
